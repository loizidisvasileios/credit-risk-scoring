[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "1.0.0"
description = "Credit risk scoring with gradient boosting, cost-based decision thresholds and SHAP explainability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vasileios Loizidis" },
]
keywords = [
    "credit-scoring",
    "machine-learning",
    "lightgbm",
    "calibration",
    "shap",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<4.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.6,<1.8",   # Narrower than the rest: the pickled pipeline is version-sensitive.
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
    "optuna>=3.5,<5.0",
    "shap>=0.44,<1.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.6,<3.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "dash>=2.16,<4.0",
    "plotly>=5.19,<7.0",
    "requests>=2.31,<3.0",
]
data = [
    "kaggle>=1.6,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<7.0",
    "ruff>=0.3,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = [
    "D104",
    "N803",   # Argument name should be lowercase: X is the standard name for a design matrix.
    "N806",   # Variable in function should be lowercase: same reason.
]

[tool.ruff.lint.per-file-ignores]

"tests/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]   # src/ for the library, the root for the app/ package.
addopts = "-v --strict-markers"
